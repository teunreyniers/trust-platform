# GitLab CI for trust-platform (otmatic-group mirror).
#
# Publishes a minimal Linux CI image to the GitLab Container Registry that
# downstream repos (starting with plc-tests) use to run `trust-dev test`.
#
#   registry.gitlab.com/otmatic-group/product/trust-platform/ci:<tag>
#
# Tagging:
#   - tag pipeline (vX.Y.Z): pushes :<tag>, :ci and :latest
#   - main:                  pushes the moving :ci tag for downstream pinning
#
# The image ships only release binaries + runtime deps (no Rust toolchain): the
# binaries are compiled in `build-ci-binaries` and copied into a slim Debian
# image by docker/ci/trust-ci.Dockerfile in `build-ci-image`.

stages:
  - build
  - package

variables:
  # Image build is slow once and cached after; relax the registry image name.
  CI_TRUST_IMAGE: $CI_REGISTRY_IMAGE/ci
  RUST_IMAGE: rust:1.95-bookworm
  # Use a project-local CARGO_HOME so the registry cache can be persisted.
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_TERM_COLOR: always
  # Shared/release runners do not provide sccache; disable the repo's wrapper.
  RUSTC_WRAPPER: ""

# Publish only on tag pipelines and on the default branch.
.publish-rules: &publish-rules
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Stage: build — compile the linux-x86_64 release binaries.
# ---------------------------------------------------------------------------
build-ci-binaries:
  stage: build
  image: $RUST_IMAGE
  <<: *publish-rules
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo-home/registry
      - .cargo-home/git
      - target
  script:
    - cargo build --release -p trust-dev -p trust-runtime -p trust-lsp
    - mkdir -p dist/ci/bin
    - cp target/release/trust-dev
         target/release/trust-runtime
         target/release/trust-lsp
         target/release/trust-bundle-gen
         dist/ci/bin/
    - ./dist/ci/bin/trust-dev --version
    - ./dist/ci/bin/trust-runtime --version
  artifacts:
    expire_in: 1 day
    paths:
      - dist/ci/bin/

# ---------------------------------------------------------------------------
# Stage: package — build, smoke-test, and push the CI image.
# ---------------------------------------------------------------------------
build-ci-image:
  stage: package
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  needs:
    - job: build-ci-binaries
      artifacts: true
  <<: *publish-rules
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # Determine version label and tag set.
    - TRUST_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="$CI_COMMIT_TAG ci latest"
      else
        TAGS="ci"
      fi
    - PRIMARY="$CI_TRUST_IMAGE:$(echo $TAGS | cut -d' ' -f1)"
    # Build once, then re-tag for every requested tag.
    - docker build
        --build-arg TRUST_VERSION="$TRUST_VERSION"
        -f docker/ci/trust-ci.Dockerfile
        -t "$PRIMARY" .
    # Smoke test the image before publishing (acceptance criteria).
    - docker run --rm "$PRIMARY" trust-dev --version
    - docker run --rm "$PRIMARY" trust-runtime --version
    - SMOKE_PROJECT="examples/tutorials/10_unit_testing_101"
    # Mounted workspace must be writable by the image's unprivileged user.
    - cp -r "$SMOKE_PROJECT" smoke-project
    - chmod -R a+rwX smoke-project
    - docker run --rm -v "$CI_PROJECT_DIR/smoke-project:/workspace" -w /workspace
        "$PRIMARY" trust-dev test --project . --list
    - docker run --rm -v "$CI_PROJECT_DIR/smoke-project:/workspace" -w /workspace
        "$PRIMARY" trust-dev test --project . --ci --output junit > trust-smoke-junit.xml
    - test -s trust-smoke-junit.xml
    # Publish all tags.
    - |
      for tag in $TAGS; do
        target="$CI_TRUST_IMAGE:$tag"
        docker tag "$PRIMARY" "$target"
        docker push "$target"
        echo "pushed $target"
      done
  artifacts:
    when: always
    paths:
      - trust-smoke-junit.xml
    expire_in: 7 days
